events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide nginx version from responses
    server_tokens off;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting zones
    # General API zone: 30 requests/second per IP, 10MB shared memory
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    # Upload zone: 2 requests/minute per IP (strict — file uploads are expensive)
    limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/m;

    # Return 429 on rate-limit breach (default is 503)
    limit_req_status 429;

    # Use Docker's embedded DNS — resolve upstream names at request time,
    # not at startup. This prevents nginx from crashing if a container isn't
    # ready yet when nginx first starts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upstream services
    upstream frontend {
        server frontend:80;
    }

    upstream backend {
        server backend:5000;
    }

    upstream virtuoso {
        server virtuoso:8890;
    }

    upstream lodview {
        server lodview:8080;
    }

    # -----------------------------------------------------------------------
    # HTTP — redirect all traffic to HTTPS
    # Uncomment the redirect block and HTTPS server block when SSL is in place.
    # While certificates are not yet provisioned, the plain HTTP server below
    # is used instead (remove it once HTTPS is active).
    # -----------------------------------------------------------------------

    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }

    # -----------------------------------------------------------------------
    # HTTPS server — uncomment and configure once SSL certificates are ready
    # -----------------------------------------------------------------------
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #     ...same location blocks as below...
    # }

    server {
        listen 80;
        server_name _;

        # ---- ACME challenge — served here so Let's Encrypt can validate the domain
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ---- Security headers ------------------------------------------------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # CSP: allows Angular Material inline styles/scripts and external font/icon CDNs
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        # HSTS — enable once HTTPS is active (keep commented for HTTP-only deployments)
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Frontend (Angular SPA)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API — rate limited; CORS is handled entirely by Flask
        location /api/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Upload endpoint — stricter rate limit (expensive operation)
        location /api/upload {
            limit_req zone=upload burst=5;

            proxy_pass http://backend/api/upload;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            client_max_body_size 1g;
        }

        # Virtuoso SPARQL endpoint — internal access only
        location /virtuoso/ {
            allow 127.0.0.1;
            allow 172.16.0.0/12;  # Docker internal network
            deny all;

            proxy_pass http://virtuoso/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # LODView — resource browsing
        location /resource/ {
            proxy_pass http://lodview/resource/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # LODView admin interface — internal access only
        location /lodview/ {
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;

            proxy_pass http://lodview/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check — unauthenticated, no logging
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}