services:
  # ---- Traefik — reverse proxy + automatic Let's Encrypt SSL ----------------
  # HTTP mode  (SSL_ENABLED=false, default): plain HTTP on port 80
  # HTTPS mode (SSL_ENABLED=true):           Traefik auto-requests cert from Let's Encrypt,
  #                                           redirects HTTP→HTTPS. No init script needed.
  traefik:
    image: traefik:v3.3
    environment:
      - SSL_ENABLED=${SSL_ENABLED:-false}
      - CERT_EMAIL=${CERT_EMAIL:-admin@example.com}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # No Docker socket needed — routing is defined in traefik/dynamic.yml
      - ./traefik:/traefik
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ "$$SSL_ENABLED" = "true" ]; then
          exec traefik \
            --providers.file.directory=/traefik \
            --providers.file.watch=true \
            --entrypoints.web.address=:80 \
            --entrypoints.web.http.redirections.entryPoint.to=websecure \
            --entrypoints.web.http.redirections.entryPoint.scheme=https \
            --entrypoints.websecure.address=:443 \
            --certificatesresolvers.letsencrypt.acme.httpchallenge=true \
            --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web \
            "--certificatesresolvers.letsencrypt.acme.email=$$CERT_EMAIL" \
            --certificatesresolvers.letsencrypt.acme.storage=/traefik/acme.json \
            --api.insecure=true \
            --ping=true
        else
          exec traefik \
            --providers.file.directory=/traefik \
            --providers.file.watch=true \
            --entrypoints.web.address=:80 \
            --entrypoints.websecure.address=:443 \
            --certificatesresolvers.letsencrypt.acme.httpchallenge=true \
            --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web \
            "--certificatesresolvers.letsencrypt.acme.email=$$CERT_EMAIL" \
            --certificatesresolvers.letsencrypt.acme.storage=/traefik/acme.json \
            --api.insecure=true \
            --ping=true
        fi
    restart: unless-stopped
    networks:
      - kg-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- Angular frontend -------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - kg-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---- Python / Gunicorn backend ---------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - VIRTUOSO_URL=${VIRTUOSO_URL:-http://virtuoso:8890}
      - EXTERNAL_VIRTUOSO_URL=${EXTERNAL_VIRTUOSO_URL:-http://localhost:8890}
      - EXTERNAL_LODVIEW_URL=${EXTERNAL_LODVIEW_URL:-http://localhost:8080}
      - EXTERNAL_BACKEND_URL=${EXTERNAL_BACKEND_URL:-http://localhost/api}
      - EXTERNAL_FRONTEND_URL=${EXTERNAL_FRONTEND_URL:-http://localhost}
      - GRAPH_BASE_URI=${GRAPH_BASE_URI:-http://localhost/graph}
      - DEFAULT_GRAPH_NAME=${DEFAULT_GRAPH_NAME:-default}
      - SPARQL_ENDPOINT=${SPARQL_ENDPOINT:-http://localhost:8890/sparql}
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-false}
      - MAX_CONTENT_LENGTH=${MAX_CONTENT_LENGTH:-1073741824}
      - DBA_PASSWORD=${DBA_PASSWORD:-dba}
      - UPLOAD_JOBS_STORAGE=${UPLOAD_JOBS_STORAGE:-file}
    restart: unless-stopped
    depends_on:
      - virtuoso
    networks:
      - kg-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 256M

  # ---- Virtuoso triplestore --------------------------------------------------
  virtuoso:
    image: tenforce/virtuoso:1.3.2-virtuoso7.2.5.1
    environment:
      - DBA_PASSWORD=${DBA_PASSWORD:-dba}
      - SPARQL_UPDATE=${SPARQL_UPDATE:-false}
      - DEFAULT_GRAPH=${GRAPH_BASE_URI:-http://localhost/graph}/${DEFAULT_GRAPH_NAME:-default}
    ports:
      - "${VIRTUOSO_PORT:-8890}:8890"
    volumes:
      - virtuoso-data:/database
    restart: unless-stopped
    networks:
      - kg-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8890/sparql"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          memory: 512M

  # ---- LODView linked-data browser -------------------------------------------
  lodview:
    image: linkeddatacenter/lodview:latest
    environment:
      LODVIEW_SPARQLENDPOINT: ${VIRTUOSO_URL:-http://virtuoso:8890}/sparql
      LODVIEW_URISPACE: ${GRAPH_BASE_URI:-http://localhost/graph}/
      LODVIEW_PUBLICURLPREFIX: ${EXTERNAL_LODVIEW_URL:-http://localhost/lodview}/
    restart: unless-stopped
    depends_on:
      - virtuoso
    networks:
      - kg-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  kg-network:
    driver: bridge

volumes:
  virtuoso-data: