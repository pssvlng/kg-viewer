# Traefik dynamic configuration — loaded automatically on startup and hot-reloaded on change.
# All routing lives here (file provider). No Docker socket or labels are used.

http:

  # ---------------------------------------------------------------------------
  # Routers — HTTP
  # ---------------------------------------------------------------------------
  routers:
    frontend:
      rule: "PathPrefix(`/`)"
      entrypoints: ["web"]
      priority: 1
      middlewares: ["default"]
      service: frontend-svc

    backend:
      rule: "PathPrefix(`/api`)"
      entrypoints: ["web"]
      priority: 10
      middlewares: ["default"]
      service: backend-svc

    lodview:
      rule: "PathPrefix(`/resource`) || PathPrefix(`/lodview`)"
      entrypoints: ["web"]
      priority: 10
      middlewares: ["default"]
      service: lodview-svc

    # -------------------------------------------------------------------------
    # Routers — HTTPS (only active when SSL_ENABLED=true starts the websecure
    # entrypoint with a certresolver; harmless when SSL is off).
    # -------------------------------------------------------------------------
    frontend-secure:
      rule: "PathPrefix(`/`)"
      entrypoints: ["websecure"]
      priority: 1
      middlewares: ["default"]
      service: frontend-svc
      tls:
        certResolver: letsencrypt

    backend-secure:
      rule: "PathPrefix(`/api`)"
      entrypoints: ["websecure"]
      priority: 10
      middlewares: ["default"]
      service: backend-svc
      tls:
        certResolver: letsencrypt

    lodview-secure:
      rule: "PathPrefix(`/resource`) || PathPrefix(`/lodview`)"
      entrypoints: ["websecure"]
      priority: 10
      middlewares: ["default"]
      service: lodview-svc
      tls:
        certResolver: letsencrypt

  # ---------------------------------------------------------------------------
  # Services — point to the internal Docker hostnames
  # ---------------------------------------------------------------------------
  services:
    frontend-svc:
      loadBalancer:
        servers:
          - url: "http://frontend:80"

    backend-svc:
      loadBalancer:
        servers:
          - url: "http://backend:5000"

    lodview-svc:
      loadBalancer:
        servers:
          - url: "http://lodview:8080"

  # ---------------------------------------------------------------------------
  # Middlewares
  # ---------------------------------------------------------------------------
  middlewares:

    # Gzip / Brotli compression
    compress:
      compress: {}

    # Security headers
    security-headers:
      headers:
        customResponseHeaders:
          X-Frame-Options: "SAMEORIGIN"
          X-Content-Type-Options: "nosniff"
          X-XSS-Protection: "1; mode=block"
          Referrer-Policy: "strict-origin-when-cross-origin"
          Permissions-Policy: "camera=(), microphone=(), geolocation=()"
          Content-Security-Policy: >-
            default-src 'self';
            script-src 'self' 'unsafe-inline' https://unpkg.com;
            style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
            font-src 'self' data: https://fonts.gstatic.com;
            img-src 'self' data:;
            connect-src 'self';
            frame-ancestors 'none';
          # Sent on all responses; browsers ignore HSTS on plain HTTP connections
          # so this is safe even in HTTP-only mode.
          Strict-Transport-Security: "max-age=31536000; includeSubDomains"

    # Chain applied to every router
    default:
      chain:
        middlewares:
          - compress
          - security-headers
